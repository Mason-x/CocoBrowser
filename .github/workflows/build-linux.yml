# Builds the Linux packages (deb / rpm / AppImage) and, when a tag is in play,
# attaches them to that release.
#
# CI is the only place these can be produced: Tauri bundles against the host's
# GTK/WebKit, so the Windows machine this fork is maintained on cannot cross-build
# them.
#
# Pinned to ubuntu-22.04 rather than -latest because the app links glibc and
# WebKitGTK dynamically — a package built against a newer glibc refuses to start
# on older distros, and 22.04 is the oldest image still carrying webkit2gtk-4.1.

name: Build Linux packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to. Empty keeps the packages as workflow artifacts only."
        type: string
        required: false
      arm64:
        description: "Also build arm64 (needs the ubuntu-22.04-arm runner)"
        type: boolean
        default: false

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # arm64 is opt-in: the arm runner is free on public repos but billed on
    # private ones, so a tag push must not depend on a label the account may not
    # be able to schedule.
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arm64 && '["x86_64","aarch64"]' || '["x86_64"]') }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}

    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux prerequisites, plus patchelf for the AppImage bundler.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file patchelf \
            libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev \
            libayatana-appindicator3-dev libxdo-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # build.rs stamps BUILD_VERSION from GITHUB_REF_NAME, which on a manual run
      # is the branch name — set BUILD_TAG so a dispatch build is labelled as the
      # nightly it is instead of "main".
      - name: Resolve build version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [ -n "$tag" ]; then
            echo "BUILD_TAG=$tag" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          else
            echo "BUILD_TAG=nightly-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      # File names carry the version from package.json, so a tag that disagrees
      # would publish assets contradicting the release they hang off.
      - name: Check the tag matches the packaged version
        if: env.RELEASE_TAG != ''
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$RELEASE_TAG" in
            "v$version" | "v$version-"*) ;;
            *)
              echo "tag $RELEASE_TAG does not match package version $version" >&2
              exit 1
              ;;
          esac

      # build.rs treats an empty value as a real password rather than falling
      # back to its default, so this is exported only when the secret is set.
      - name: Export vault password
        env:
          VAULT_PASSWORD: ${{ secrets.COCO_BROWSER_VAULT_PASSWORD }}
        run: |
          if [ -n "$VAULT_PASSWORD" ]; then
            echo "COCO_BROWSER_VAULT_PASSWORD=$VAULT_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build packages
        run: pnpm tauri build --bundles deb,rpm,appimage

      - name: Collect packages
        run: |
          mkdir -p artifacts
          find src-tauri/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} artifacts/ \;
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: artifacts

      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      # A missing release is created as a draft: publishing is the maintainer's
      # call, and a tag push should not put anything in front of users on its own.
      - name: Ensure the release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --title "$RELEASE_TAG" --generate-notes
          fi

      # The in-app updater checks a download against the release's single
      # SHA256SUMS.txt, so this file has to accumulate every platform's assets
      # instead of being replaced by whichever workflow ran last.
      - name: Merge checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: artifacts
        run: |
          if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS.txt --output existing.txt; then
            echo "Merging into the release's existing SHA256SUMS.txt"
          else
            : > existing.txt
          fi
          # A checksums file written on Windows can carry a UTF-8 BOM, which would
          # glue itself to the first hash and make that line unparseable.
          sed -i '1s/^\xef\xbb\xbf//' existing.txt
          sha256sum *.deb *.rpm *.AppImage > new.txt 2>/dev/null || true
          # New lines are read first, so a rebuilt file replaces its old hash.
          awk '{ name = $2; sub(/^\*/, "", name); if (!(name in seen)) { seen[name] = 1; print } }' new.txt existing.txt |
            sort -k2 > SHA256SUMS.txt
          rm -f existing.txt new.txt
          cat SHA256SUMS.txt

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: artifacts
        run: |
          # Packages first. Clients trust SHA256SUMS.txt, so it must never land
          # on the release before the files it vouches for.
          for file in *.deb *.rpm *.AppImage; do
            [ -e "$file" ] || continue
            gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          done
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
