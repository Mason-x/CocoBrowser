# Builds the coco-sync server image and publishes it to GitHub Container Registry.
#
# Exists so a NAS can deploy with a pasted docker-compose.yml alone: those GUIs
# create only the compose file, with no source tree to build from, so the compose
# has to reference a prebuilt `image:`.
#
# Built for both amd64 and arm64 because NAS hardware is split between them, and an
# image built only for the runner's architecture would fail to start on the other.

name: Publish sync image

on:
  push:
    # The remote's default branch is `main`; the local clone this is developed on
    # uses `master` and pushes `master:main`. Both are listed so the trigger does
    # not depend on which name the pushing side happens to use.
    branches: [main, master]
    # Only the server's own inputs. The desktop app is irrelevant to this image.
    paths:
      - "coco-sync/**"
      - ".dockerignore"
      - ".github/workflows/publish-sync-image.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase in image names, and GitHub owners may contain it.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cocobrowser-sync" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # The Dockerfile copies `coco-sync/...`, so the context is the repo root.
          context: .
          file: coco-sync/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
