[files]
extend-exclude = [
    "src-tauri/src/territory_info.xml",
    "src/i18n/locales/*.json",
    # Portable build output. Running it populates a Chromium profile whose
    # cache filenames are content hashes, which trip the spell checker.
    "artifacts/",
    # Build state regenerated by tsc. Listed explicitly rather than relying on
    # .gitignore, because typos only honours ignore files inside a git
    # repository and this must pass in a plain source checkout too.
    "*.tsbuildinfo",
]

[default.extend-words]
DBE = "DBE"
nd = "nd"
